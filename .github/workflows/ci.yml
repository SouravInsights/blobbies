name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from `packageManager` in package.json. Naming it
      # here as well is an error to the action, not a default.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Before typecheck, not after: every package resolves `blobbies` and its
      # siblings through their published `types` entry, which points at `dist`.
      # On a fresh checkout those do not exist yet, so typecheck would fail on
      # "Cannot find module 'blobbies'" before it checked a single thing.
      - name: Build
        run: pnpm build

      # Before typecheck, because it is faster and it catches a different
      # class: a hook called conditionally, an `any` in a public signature, a
      # `console.log` left in a package.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # One spec, two frameworks, in a real browser. Everything the runtime's
      # jsdom tests cannot answer — the size of a cell once the panel has a real
      # width, whether the lens enlarges anything, whether a throw carries — is
      # answered here, in the place a finger would be.
      - name: Install the browsers
        run: npx playwright install --with-deps chromium webkit

      - name: End-to-end (React, Vue and Svelte)
        run: pnpm test:e2e

      # The only check that can see a version skew, because it is the only one
      # that installs the real tarballs instead of resolving through the
      # workspace — where there is one of everything and no skew is possible.
      - name: Release check
        run: pnpm check:release
