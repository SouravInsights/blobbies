<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.5 -1.5 103 103" width="103" height="103" role="img" aria-label="Blobbies">
  <title>Blobbies</title>
  <!-- Light variant: the page's own light surface (#fbfaf7) behind the mark, with
       the disk inset to 97% of the frame. A platform's circle crop lands in that
       1.5% margin, so the disk edge never gets sliced and no pale fringe shows. -->
  <defs>
    <clipPath id="bb-jpg-light-clip">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
  </defs>
  <rect x="-1.5" y="-1.5" width="103" height="103" fill="#fbfaf7"/>
  <circle cx="50" cy="50" r="50" fill="#2f2f2f"/>
  <g clip-path="url(#bb-jpg-light-clip)">
    <g transform="translate(50 61.09)">
      <path d="M44 10.18C44 -23.34 22 -37.7 0 -37.7C-22 -37.7 -44 -23.34 -44 10.18C-44 25.2 -24 38 0 38C24 38 44 25.2 44 10.18Z" fill="#FFD43B"/>
    </g>
  </g>
  <g fill="#1c1c1c">
    <circle cx="38" cy="56.2" r="7.5"/>
    <circle cx="61" cy="56.2" r="7.5"/>
    <path transform="translate(50 78)" d="M-9 0 A9 7 0 0 0 9 0 Z"/>
  </g>
</svg>
